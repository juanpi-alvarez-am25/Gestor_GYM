<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Planes')}"></head>
<body><nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-4"><div th:replace="~{fragmentos :: mensajes}"></div>
<p class="eyebrow">MEMBRESÍAS</p><h1>Planes disponibles</h1><p class="text-secondary">Cada contratación conserva el precio y los límites del momento de la operación.</p><div class="row g-4 my-3"><div th:each="p : ${planes}" class="col-md-4"><article class="card p-4 h-100"><h2 th:text="${p.nombre}" class="h3"></h2><strong class="precio" th:text="${'$ ' + #numbers.formatDecimal(p.precio, 1, 'POINT', 2, 'COMMA')}"></strong><p class="mt-3" th:text="${p.duracionDias + ' días por período'}"></p><p th:text="${p.limiteSemanal == 0} ? 'Días semanales sin límite' : ${p.limiteSemanal + ' días distintos por semana'}"></p><span class="badge text-bg-light border align-self-start" th:text="${p.activo} ? 'Disponible' : 'No disponible'"></span></article></div></div><a class="btn btn-primary" th:href="@{/socios}">Elegir un socio para contratar</a>
</main><footer th:replace="~{fragmentos :: pie}"></footer></body></html>
