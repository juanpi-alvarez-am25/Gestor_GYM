<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Vencimientos')}"></head>
<body><nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-4"><div th:replace="~{fragmentos :: mensajes}"></div>
<p class="eyebrow">SEGUIMIENTO</p><h1>Vencimientos</h1><form method="get" th:action="@{/vencimientos}" class="card p-3 my-4"><div class="row g-3 align-items-end"><div class="col-md-5"><label for="estado" class="form-label">Estado de la membresía</label><select class="form-select" id="estado" name="estado"><option value="POR_VENCER" th:selected="${estado == 'POR_VENCER'}">Por vencer</option><option value="VIGENTES" th:selected="${estado == 'VIGENTES'}">Vigentes</option><option value="VENCIDAS" th:selected="${estado == 'VENCIDAS'}">Vencidas</option><option value="SIN_PLAN" th:selected="${estado == 'SIN_PLAN'}">Sin plan contratado</option></select></div><div class="col-md-4"><label for="dias" class="form-label">Próximos días (solo por vencer)</label><input class="form-control" id="dias" name="dias" type="number" min="1" max="90" th:value="${dias}" required></div><div class="col-md-3"><button class="btn btn-dark">Consultar</button></div></div></form><p class="text-secondary">Se muestran socios activos. El último día del período está incluido.</p><p th:if="${#lists.isEmpty(resultados)}" class="estado-vacio">No hay socios para este filtro.</p><div class="table-responsive card" th:unless="${#lists.isEmpty(resultados)}"><table class="table mb-0"><thead><tr><th>Socio</th><th>Plan de referencia</th><th>Vencimiento</th><th>Acción</th></tr></thead><tbody><tr th:each="r : ${resultados}" th:with="m=${r.actual != null ? r.actual : r.ultimo}"><td th:text="${r.socio.nombreCompleto}"></td><td th:text="${m == null} ? 'Sin plan' : ${m.plan.nombre}"></td><td th:text="${m == null} ? '—' : ${#temporals.format(m.vencimiento, 'dd/MM/yyyy')}"></td><td><a th:href="@{/socios/{id}(id=${r.socio.id})}">Ver ficha</a></td></tr></tbody></table></div>
</main><footer th:replace="~{fragmentos :: pie}"></footer></body></html>
