<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Recepción')}"></head>
<body><nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-4"><div th:replace="~{fragmentos :: mensajes}"></div>
<div class="encabezado"><div><p class="eyebrow">ACCESOS</p><h1>Recepción</h1><p class="text-secondary">Los días semanales se cuentan de lunes a domingo.</p></div><span th:text="${#temporals.format(hoy, 'dd/MM/yyyy')}"></span></div><form method="get" th:action="@{/recepcion}" class="card p-3 my-4"><label for="q" class="form-label">Buscar socio por nombre, DNI o número</label><div class="d-flex gap-2"><input class="form-control" id="q" name="q" th:value="${q}" autofocus><button class="btn btn-dark">Buscar</button></div></form>
<p class="estado-vacio" th:if="${#lists.isEmpty(resultados)}">No hay coincidencias. Revisá la búsqueda o registrá al socio.</p><div class="row g-3"><div class="col-lg-6" th:each="r : ${resultados}"><article class="card p-4 h-100"><div class="d-flex justify-content-between gap-2"><h2 class="h5" th:text="${r.socio.nombreCompleto}"></h2><span class="text-secondary" th:text="${r.socio.numeroSocio}"></span></div><p th:text="${'DNI ' + r.socio.dni}"></p><p class="fw-semibold" th:text="${#strings.isEmpty(r.motivoRechazo)} ? 'Puede ingresar hoy' : ${r.motivoRechazo}"></p><p class="text-secondary" th:text="${'Días utilizados esta semana: ' + r.diasConsumidos}"></p><div class="d-flex gap-2 flex-wrap mt-auto"><form method="post" th:action="@{/recepcion/{id}/ingreso(id=${r.socio.id})}" th:if="${!r.visitaAbierta}"><button class="btn btn-primary" th:disabled="${!#strings.isEmpty(r.motivoRechazo)}">Registrar ingreso</button></form><form method="post" th:action="@{/recepcion/{id}/salida(id=${r.socio.id})}" th:if="${r.visitaAbierta}"><button class="btn btn-dark">Registrar salida</button></form><a class="btn btn-outline-secondary" th:href="@{/socios/{id}(id=${r.socio.id})}">Ver ficha</a></div></article></div></div>
</main><footer th:replace="~{fragmentos :: pie}"></footer></body></html>
