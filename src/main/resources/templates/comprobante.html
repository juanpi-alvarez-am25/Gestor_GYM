<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Comprobante interno')}"></head>
<body><nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-4"><div th:replace="~{fragmentos :: mensajes}"></div>
<article class="card comprobante p-4 p-md-5 mx-auto" th:with="m=${pago.membresia}"><p class="eyebrow">GYMADMINAPP</p><h1 class="h2">Comprobante interno de pago</h1><p class="text-secondary">No válido como factura fiscal.</p><hr><dl class="row"><dt class="col-sm-4">Número</dt><dd class="col-sm-8 rompe-texto" th:text="${pago.numeroComprobante}"></dd><dt class="col-sm-4">Fecha y hora</dt><dd class="col-sm-8" th:text="${#temporals.format(pago.fechaHora, 'dd/MM/yyyy HH:mm:ss')}"></dd><dt class="col-sm-4">Socio</dt><dd class="col-sm-8" th:text="${m.socio.numeroSocio + ' · ' + m.socio.nombreCompleto}"></dd><dt class="col-sm-4">DNI</dt><dd class="col-sm-8" th:text="${m.socio.dni}"></dd><dt class="col-sm-4">Plan</dt><dd class="col-sm-8" th:text="${m.plan.nombre}"></dd><dt class="col-sm-4">Período incluido</dt><dd class="col-sm-8" th:text="${#temporals.format(m.inicio, 'dd/MM/yyyy') + ' al ' + #temporals.format(m.vencimiento, 'dd/MM/yyyy')}"></dd><dt class="col-sm-4">Método</dt><dd class="col-sm-8" th:text="${pago.metodo}"></dd></dl><div class="total"><span>Total abonado</span><strong th:text="${'$ ' + #numbers.formatDecimal(pago.importe, 1, 'POINT', 2, 'COMMA')}"></strong></div><div class="d-flex gap-3 mt-4 no-print"><button type="button" class="btn btn-primary" onclick="window.print()">Imprimir</button><a class="btn btn-outline-secondary" th:href="@{/socios/{id}(id=${m.socio.id})}">Volver a la ficha</a></div></article>
</main><footer th:replace="~{fragmentos :: pie}"></footer></body></html>
