<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Personal')}"></head>
<body><nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-4"><div th:replace="~{fragmentos :: mensajes}"></div>
<div class="encabezado"><div><p class="eyebrow">EQUIPO</p><h1>Personal</h1></div><a class="btn btn-primary" th:href="@{/personal/nuevo}">Nuevo integrante</a></div>
<form method="get" th:action="@{/personal}" class="card p-3 my-4"><div class="row g-3 align-items-end"><div class="col-md-6"><label for="tipo" class="form-label">Función</label><select class="form-select" id="tipo" name="tipo"><option value="">Todas</option><option th:each="t : ${tipos}" th:value="${t}" th:text="${t}" th:selected="${tipo == t}"></option></select></div><div class="col-md-3"><button class="btn btn-dark">Filtrar</button></div></div></form>
<p class="estado-vacio" th:if="${#lists.isEmpty(personal)}">No hay personal para este filtro.</p><div class="table-responsive card" th:unless="${#lists.isEmpty(personal)}"><table class="table align-middle mb-0"><thead><tr><th>Nombre</th><th>DNI</th><th>Función</th><th>Especialidad y horario</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="e : ${personal}"><td th:text="${e.nombreCompleto}"></td><td th:text="${e.dni}"></td><td th:text="${e.tipo}"></td><td><span th:if="${e.tipo.name() == 'ENTRENADOR'}" th:text="${e.especialidad + ' · ' + e.horario}"></span><span th:unless="${e.tipo.name() == 'ENTRENADOR'}">—</span></td><td th:text="${e.activo} ? 'Activo' : 'Inactivo'"></td><td><div class="d-flex gap-2 flex-wrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/personal/{id}/editar(id=${e.id})}">Editar</a><form method="post" th:action="@{/personal/{id}/estado(id=${e.id})}"><input type="hidden" name="activo" th:value="${!e.activo}"><button class="btn btn-sm btn-outline-secondary" th:text="${e.activo} ? 'Dar de baja' : 'Reactivar'"></button></form></div></td></tr></tbody></table></div>
</main><footer th:replace="~{fragmentos :: pie}"></footer></body></html>
