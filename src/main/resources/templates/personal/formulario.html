<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Datos del personal')}"></head>
<body><nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-4"><div th:replace="~{fragmentos :: mensajes}"></div>
<p class="eyebrow">PERSONAL</p><h1 th:text="${id != null} ? 'Editar personal' : 'Nuevo integrante'"></h1><form class="card p-4 my-4" method="post" th:action="${id != null} ? @{/personal/{id}(id=${id})} : @{/personal}" th:object="${form}"><div th:replace="~{fragmentos :: errores}"></div><div th:replace="~{fragmentos :: datosPersona}"></div>
<div class="row g-3 mt-2"><div class="col-md-4"><label for="tipo" class="form-label">Función</label><select class="form-select" id="tipo" th:field="*{tipo}" required><option value="">Seleccione</option><option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option></select><p class="text-danger" th:errors="*{tipo}"></p></div><div class="col-md-4"><label for="especialidad" class="form-label">Especialidad del entrenador</label><select class="form-select" id="especialidad" th:field="*{especialidad}"><option value="">No corresponde</option><option th:each="e : ${especialidades}" th:value="${e}" th:text="${e}"></option></select></div><div class="col-md-4"><label for="horario" class="form-label">Horario del entrenador</label><input class="form-control" id="horario" th:field="*{horario}" maxlength="120" placeholder="Lunes a viernes, 8 a 16"><p class="text-danger" th:errors="*{horario}"></p></div></div><p class="text-secondary mt-3">Especialidad y horario son obligatorios para entrenadores. La función de entrenador se define al dar de alta.</p><div class="d-flex gap-3"><button class="btn btn-primary">Guardar personal</button><a class="btn btn-outline-secondary" th:href="@{/personal}">Cancelar</a></div></form>
</main><footer th:replace="~{fragmentos :: pie}"></footer></body></html>
