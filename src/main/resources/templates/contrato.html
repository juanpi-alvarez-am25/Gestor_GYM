<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Contratar o renovar')}"></head>
<body><nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-4"><div th:replace="~{fragmentos :: mensajes}"></div>
<p class="eyebrow">MEMBRESÍAS Y PAGOS</p><h1>Contratar o renovar</h1><p class="text-secondary" th:text="${socio.numeroSocio + ' · ' + socio.nombreCompleto}"></p><div th:if="${bloqueo}" class="alert alert-warning" th:text="${bloqueo}" role="alert"></div>
<form th:unless="${#lists.isEmpty(opciones)}" method="post" th:action="@{/socios/{id}/contratar(id=${socio.id})}" th:object="${form}" class="card p-4 my-4"><div th:replace="~{fragmentos :: errores}"></div><input type="hidden" th:field="*{claveOperacion}"><p class="text-danger" th:errors="*{claveOperacion}"></p><fieldset><legend class="h4">Elegí el plan</legend><div th:each="o : ${opciones}" class="opcion-plan"><input type="radio" th:field="*{planId}" th:value="${o.plan.id}" required><label th:for="${#ids.prev('planId')}"><strong th:text="${o.plan.nombre}"></strong><span th:text="${' · $ ' + #numbers.formatDecimal(o.plan.precio, 1, 'POINT', 2, 'COMMA')}"></span><br><span th:text="${#temporals.format(o.inicio, 'dd/MM/yyyy') + ' al ' + #temporals.format(o.vencimiento, 'dd/MM/yyyy') + ' inclusive'}"></span><br><small th:text="${o.plan.limiteSemanal == 0} ? 'Sin límite semanal' : ${o.plan.limiteSemanal + ' días distintos por semana'}"></small></label></div><p class="text-danger" th:errors="*{planId}"></p></fieldset><label for="metodo" class="form-label mt-4">Método del pago recibido</label><select class="form-select" id="metodo" th:field="*{metodo}" required><option value="">Seleccione</option><option th:each="m : ${metodos}" th:value="${m}" th:text="${m}"></option></select><p class="text-danger" th:errors="*{metodo}"></p><p class="text-secondary mt-3">Se registra un único pago completo. Verificá el plan y el medio antes de confirmar.</p><button class="btn btn-primary align-self-start">Confirmar contratación y pago</button></form><p th:if="${#lists.isEmpty(opciones) and bloqueo == null}" class="estado-vacio">No hay planes disponibles.</p><a th:href="@{/socios/{id}(id=${socio.id})}">Volver a la ficha</a>
</main><footer th:replace="~{fragmentos :: pie}"></footer></body></html>
