<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Socios')}"></head>
<body><nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-4"><div th:replace="~{fragmentos :: mensajes}"></div>
<div class="encabezado"><div><p class="eyebrow">ADMINISTRACIÓN</p><h1>Socios</h1></div><a class="btn btn-primary" th:href="@{/socios/nuevo}">Nuevo socio</a></div>
<form class="card p-3 my-4" method="get" th:action="@{/socios}"><div class="row g-3 align-items-end"><div class="col-md-7"><label for="q" class="form-label">Buscar por nombre, apellido, DNI o número</label><input class="form-control" id="q" name="q" th:value="${q}" placeholder="Ej.: S000001"></div><div class="col-md-3"><label for="estado" class="form-label">Estado</label><select class="form-select" id="estado" name="estado"><option value="TODOS" th:selected="${estado == 'TODOS'}">Todos</option><option value="ACTIVOS" th:selected="${estado == 'ACTIVOS'}">Activos</option><option value="INACTIVOS" th:selected="${estado == 'INACTIVOS'}">Inactivos</option></select></div><div class="col-md-2"><button class="btn btn-dark w-100">Buscar</button></div></div></form>
<div th:if="${#lists.isEmpty(socios)}" class="estado-vacio">No hay socios que coincidan. Podés cambiar la búsqueda o registrar uno nuevo.</div>
<div class="table-responsive card" th:unless="${#lists.isEmpty(socios)}"><table class="table align-middle mb-0"><thead><tr><th>Número</th><th>Socio</th><th>DNI</th><th>Teléfono</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="s : ${socios}"><td th:text="${s.numeroSocio}"></td><td th:text="${s.nombreCompleto}"></td><td th:text="${s.dni}"></td><td th:text="${s.telefono}"></td><td><span class="badge" th:classappend="${s.activo} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${s.activo} ? 'Activo' : 'Inactivo'"></span></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/socios/{id}(id=${s.id})}">Ver ficha</a></td></tr></tbody></table></div>
</main><footer th:replace="~{fragmentos :: pie}"></footer></body></html>
