spring.application.name=GymAdminApp
server.address=${GYM_ADDRESS:127.0.0.1}
server.port=${GYM_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
spring.thymeleaf.encoding=UTF-8
spring.web.locale=es_AR
spring.web.locale-resolver=fixed
gym.db.url=${GYM_DB_URL:jdbc:mysql://localhost:3306/gymadmin?connectionTimeZone=America/Argentina/Buenos_Aires}
gym.db.user=${GYM_DB_USER:gymadmin}
gym.db.password=${GYM_DB_PASSWORD}
logging.level.DataNucleus.Query=WARN
logging.level.DataNucleus.Datastore=WARN
